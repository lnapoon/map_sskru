<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>เข้าสู่ระบบ — SSKRU Campus Map</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --primary: #1a4fa0;
      --primary-dark: #0d2c5e;
      --primary-light: #2563eb;
      --accent: #f59e0b;
      --danger: #ef4444;
      --success: #10b981;
      --surface: #ffffff;
      --text: #1e293b;
      --text-secondary: #64748b;
    }

    body {
      font-family: 'Sarabun', 'Outfit', sans-serif;
      background: linear-gradient(135deg, #0d2c5e 0%, #1a4fa0 40%, #2563eb 70%, #1e40af 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      position: relative;
      overflow: hidden;
    }

    /* Animated background blobs */
    body::before, body::after {
      content: '';
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.25;
      animation: float 8s ease-in-out infinite alternate;
    }
    body::before {
      width: 500px; height: 500px;
      background: #f59e0b;
      top: -150px; right: -100px;
    }
    body::after {
      width: 400px; height: 400px;
      background: #10b981;
      bottom: -100px; left: -80px;
      animation-delay: 4s;
    }
    @keyframes float {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(40px, -30px) scale(1.1); }
    }

    /* Floating particles */
    .particles {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none;
      overflow: hidden;
      z-index: 0;
    }
    .particle {
      position: absolute;
      width: 6px; height: 6px;
      background: rgba(255,255,255,0.15);
      border-radius: 50%;
      animation: rise 12s linear infinite;
    }
    .particle:nth-child(2) { left: 15%; width: 4px; height: 4px; animation-delay: 2s; animation-duration: 14s; }
    .particle:nth-child(3) { left: 35%; width: 8px; height: 8px; animation-delay: 4s; animation-duration: 10s; }
    .particle:nth-child(4) { left: 55%; width: 3px; height: 3px; animation-delay: 1s; animation-duration: 16s; }
    .particle:nth-child(5) { left: 75%; width: 5px; height: 5px; animation-delay: 6s; animation-duration: 11s; }
    .particle:nth-child(6) { left: 90%; width: 7px; height: 7px; animation-delay: 3s; animation-duration: 13s; }
    @keyframes rise {
      0% { bottom: -10%; opacity: 0; }
      10% { opacity: 1; }
      90% { opacity: 0.5; }
      100% { bottom: 110%; opacity: 0; }
    }

    .login-card {
      position: relative;
      z-index: 1;
      background: rgba(255,255,255,0.95);
      backdrop-filter: blur(20px);
      border-radius: 24px;
      box-shadow: 0 25px 80px rgba(0,0,0,0.25);
      width: 100%;
      max-width: 440px;
      overflow: hidden;
      animation: cardIn 0.6s cubic-bezier(0.23, 1, 0.32, 1);
    }
    @keyframes cardIn {
      0% { opacity: 0; transform: translateY(30px) scale(0.95); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }

    .card-header {
      background: linear-gradient(135deg, var(--primary-dark), var(--primary-light));
      padding: 36px 32px 28px;
      text-align: center;
      position: relative;
      overflow: hidden;
    }
    .card-header::after {
      content: '';
      position: absolute;
      bottom: -20px; left: -10%; right: -10%;
      height: 40px;
      background: rgba(255,255,255,0.95);
      border-radius: 50% 50% 0 0;
    }

    .university-badge {
      width: 72px; height: 72px;
      background: rgba(255,255,255,0.15);
      border: 2px solid rgba(255,255,255,0.3);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 16px;
      font-size: 32px;
      animation: pulse 3s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(255,255,255,0.3); }
      50% { box-shadow: 0 0 0 12px rgba(255,255,255,0); }
    }

    .card-header h1 {
      color: white;
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 4px;
      letter-spacing: 0.5px;
    }
    .card-header p {
      color: rgba(255,255,255,0.75);
      font-size: 13px;
      font-weight: 300;
    }

    .card-body {
      padding: 36px 32px 28px;
    }

    .welcome-text {
      text-align: center;
      margin-bottom: 28px;
    }
    .welcome-text h2 {
      font-size: 20px;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 6px;
    }
    .welcome-text p {
      font-size: 14px;
      color: var(--text-secondary);
    }

    .form-group {
      margin-bottom: 20px;
    }
    .form-label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 8px;
    }
    .input-wrapper {
      position: relative;
    }
    .input-wrapper i {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-secondary);
      font-size: 16px;
      transition: color 0.3s;
    }
    .form-input {
      width: 100%;
      padding: 14px 14px 14px 44px;
      border: 2px solid #e2e8f0;
      border-radius: 12px;
      font-size: 16px;
      font-family: 'Sarabun', sans-serif;
      background: #f8fafc;
      transition: all 0.3s ease;
      outline: none;
      color: var(--text);
    }
    .form-input:focus {
      border-color: var(--primary-light);
      background: white;
      box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.1);
    }
    .form-input:focus + .input-icon,
    .form-input:focus ~ i {
      color: var(--primary-light);
    }
    .form-input::placeholder {
      color: #94a3b8;
    }

    .btn-login {
      width: 100%;
      padding: 15px;
      background: linear-gradient(135deg, var(--primary), var(--primary-light));
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      font-family: 'Sarabun', sans-serif;
      cursor: pointer;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      position: relative;
      overflow: hidden;
    }
    .btn-login::before {
      content: '';
      position: absolute;
      top: 0; left: -100%; width: 100%; height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
      transition: left 0.5s;
    }
    .btn-login:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(37, 99, 235, 0.35);
    }
    .btn-login:hover::before {
      left: 100%;
    }
    .btn-login:active {
      transform: translateY(0);
    }
    .btn-login:disabled {
      opacity: 0.7;
      cursor: not-allowed;
      transform: none;
    }

    .error-box {
      display: none;
      background: #fef2f2;
      border: 1px solid #fecaca;
      border-radius: 10px;
      padding: 12px 16px;
      margin-top: 16px;
      color: #dc2626;
      font-size: 14px;
      text-align: center;
      animation: shakeIn 0.4s ease;
    }
    @keyframes shakeIn {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-6px); }
      40%, 80% { transform: translateX(6px); }
    }

    .success-box {
      display: none;
      background: #f0fdf4;
      border: 1px solid #bbf7d0;
      border-radius: 10px;
      padding: 12px 16px;
      margin-top: 16px;
      color: #16a34a;
      font-size: 14px;
      text-align: center;
    }

    .card-footer {
      padding: 0 32px 28px;
      text-align: center;
    }
    .admin-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--text-secondary);
      font-size: 13px;
      text-decoration: none;
      transition: color 0.3s;
      padding: 8px 16px;
      border-radius: 8px;
    }
    .admin-link:hover {
      color: var(--primary);
      background: #f1f5f9;
    }

    .spinner {
      display: none;
      width: 20px;
      height: 20px;
      border: 3px solid rgba(255,255,255,0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 20px 0;
      color: #94a3b8;
      font-size: 12px;
    }
    .divider::before, .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: #e2e8f0;
    }

    /* Mobile responsive */
    @media (max-width: 480px) {
      body { padding: 16px; }
      .login-card { border-radius: 20px; }
      .card-header { padding: 28px 24px 22px; }
      .card-body { padding: 28px 24px 20px; }
      .card-footer { padding: 0 24px 24px; }
    }
  </style>
</head>
<body>
  <!-- Floating particles -->
  <div class="particles">
    <div class="particle" style="left: 5%;"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
  </div>

  <div class="login-card">
    <!-- Header -->
    <div class="card-header">
      <div class="university-badge">🎓</div>
      <h1>SSKRU Campus Map</h1>
      <p>ระบบแผนที่มหาวิทยาลัยราชภัฏศรีสะเกษ</p>
    </div>

    <!-- Body -->
    <div class="card-body">
      <div class="welcome-text">
        <h2>ยินดีต้อนรับ</h2>
        <p>กรุณากรอกรหัสนักศึกษาเพื่อเข้าสู่ระบบแผนที่</p>
      </div>

      <form id="login-form">
        <div class="form-group">
          <label class="form-label">รหัสนักศึกษา</label>
          <div class="input-wrapper">
            <i class="fa-solid fa-id-card"></i>
            <input type="text" id="student_id" class="form-input" required
                   placeholder="กรุณาป้อนรหัสนักศึกษา" autocomplete="off" autofocus
                   maxlength="13" inputmode="numeric">
          </div>
        </div>

        <button type="submit" class="btn-login" id="btn-submit">
          <span id="btn-text"><i class="fa-solid fa-right-to-bracket"></i> เข้าสู่ระบบ</span>
          <div class="spinner" id="btn-spinner"></div>
        </button>

        <div class="error-box" id="error-msg">
          <i class="fa-solid fa-circle-exclamation"></i>
          <span id="error-text">รหัสนักศึกษาไม่ถูกต้อง หรือไม่ได้รับสิทธิ์เข้าใช้งาน</span>
        </div>

        <div class="success-box" id="success-msg">
          <i class="fa-solid fa-circle-check"></i>
          เข้าสู่ระบบสำเร็จ! กำลังเปลี่ยนหน้า...
        </div>
      </form>
    </div>

    <!-- Footer -->
    <div class="card-footer">
      <div class="divider">หรือ</div>
      <a href="/admin/" class="admin-link">
        <i class="fa-solid fa-user-shield"></i> เข้าสู่ระบบสำหรับผู้ดูแล (Admin)
      </a>
    </div>
  </div>

  <script>
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();

      const studentId = document.getElementById('student_id').value.trim();
      if (!studentId) return;

      const btn = document.getElementById('btn-submit');
      const btnText = document.getElementById('btn-text');
      const spinner = document.getElementById('btn-spinner');
      const errorBox = document.getElementById('error-msg');
      const successBox = document.getElementById('success-msg');

      // Loading state
      btn.disabled = true;
      btnText.style.display = 'none';
      spinner.style.display = 'block';
      errorBox.style.display = 'none';
      successBox.style.display = 'none';

      try {
        const res = await fetch('/admin/api/auth/student_login/', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'same-origin',
          body: JSON.stringify({ student_id: studentId })
        });
        const data = await res.json();

        if (data.success) {
          successBox.style.display = 'block';
          setTimeout(() => {
            window.location.href = '/';
          }, 800);
        } else {
          errorBox.style.display = 'block';
          document.getElementById('error-text').textContent = data.message || 'รหัสนักศึกษาไม่ถูกต้อง หรือไม่ได้รับสิทธิ์เข้าใช้งาน';
          btn.disabled = false;
          btnText.style.display = 'flex';
          spinner.style.display = 'none';
        }
      } catch (err) {
        errorBox.style.display = 'block';
        document.getElementById('error-text').textContent = 'เกิดข้อผิดพลาดในการเชื่อมต่อ กรุณาลองใหม่อีกครั้ง';
        btn.disabled = false;
        btnText.style.display = 'flex';
        spinner.style.display = 'none';
      }
    });

    // Auto-focus input with smooth effect
    document.getElementById('student_id').addEventListener('focus', function() {
      this.closest('.input-wrapper').querySelector('i').style.color = '#2563eb';
    });
    document.getElementById('student_id').addEventListener('blur', function() {
      this.closest('.input-wrapper').querySelector('i').style.color = '';
    });
  </script>
</body>
</html>
